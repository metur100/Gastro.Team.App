name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, unit + integration tests)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'CiOnly-Str0ng!Passw0rd' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      GT_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD || 'CiOnly-Str0ng!Passw0rd' }};TrustServerCertificate=True
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Restore
        run: dotnet restore backend/GastroTeam.sln
      - name: Build (warnings for vulnerable packages fail the build)
        run: dotnet build backend/GastroTeam.sln --no-restore -c Release -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Vulnerable package check
        run: dotnet list backend/GastroTeam.sln package --vulnerable --include-transitive
      - name: Unit tests
        run: dotnet test backend/GastroTeam.Tests --no-build -c Release --filter Category=Unit --logger "trx;LogFileName=unit.trx"
      - name: Integration tests (SQL Server)
        run: dotnet test backend/GastroTeam.Tests --no-build -c Release --filter Category=Integration --logger "trx;LogFileName=integration.trx"
      - name: Migration script is up to date
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes -p backend/GastroTeam.Infrastructure -s backend/GastroTeam.Api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/GastroTeam.Tests/TestResults/*.trx

  web:
    name: Web (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://gastroteam.runasp.net
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
