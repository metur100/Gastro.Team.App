name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - name: Build
        shell: bash
        env:
          # Public API URL (not a secret). Override with the repository variable API_BASE_URL.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://gastroteam.runasp.net' }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY%/*}"
          if [ "$REPO_NAME" = "${OWNER_NAME}.github.io" ] || [ -f "public/CNAME" ]; then BASE_PATH="/"; else BASE_PATH="/$REPO_NAME/"; fi
          echo "Base path: $BASE_PATH"
          npx tsc -b
          npx vite build --base="$BASE_PATH"
          node scripts/spa-fallback.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
